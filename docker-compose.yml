# ReStock AI — local stack (SQLite).
#
#   cp backend/.env.example backend/.env    # then fill in real values
#   docker compose up --build
#
# The `migrate` service runs Alembic once and exits; `backend` waits for it to
# finish successfully.

services:
  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./backend/.env
    restart: "no"

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # One-off: load the demo dataset.
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
    command: ["python", "-m", "app.seed.seed"]
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools
    restart: "no"

  # One-off: the scheduled low-stock sweep.
  #   docker compose run --rm inventory-check
  inventory-check:
    build:
      context: ./backend
    command: ["python", "-m", "app.jobs.inventory_check"]
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles:
      - tools
    restart: "no"

